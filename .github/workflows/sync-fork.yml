name: Sync Fork
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  sync-fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote add fork https://x-access-token:${{ secrets.FORK_TOKEN }}@github.com/sarimgamerop-cloud/reminder-to-look-at-you-spfork.git
          git fetch fork main
          git checkout --orphan temp
          git rm -rf .
          git checkout main -- .
          git add -A
          git commit -m "sync"
          git push --force fork temp:main
